[package]
name = "aerospike-rust-workshop"
version = "1.0.0"
edition = "2021"
rust-version = "1.87"
description = "Aerospike Rust client SDK workshop backend"

[dependencies]
aerospike = { version = "2.1", features = ["rt-tokio"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["form"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
env_logger = "0.11"
futures = "0.3"
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
