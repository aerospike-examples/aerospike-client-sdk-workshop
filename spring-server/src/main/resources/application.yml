server:
  port: 8080

spring:
  application:
    name: retail-demo-spring
  profiles:
    active: old-client  # Default to old-client implementation
    # Alternative: new-client for enhanced implementation

# Aerospike configuration
aerospike:
  host: localhost
  port: 3000

# Logging configuration (SLF4J via Logback). Named SDK loggers live in logback-spring.xml.
logging:
  level:
    com.aerospike.client.sdk: INFO
    com.aerospikeworkshop: INFO
    root: INFO 